<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mini Tank – Pfeiltasten</title><style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#f8fafc;font-family:system-ui}main{max-width:650px;margin:auto;padding:18px;display:grid;gap:14px}h1{margin:0;font-size:clamp(22px,5vw,30px)}button{border:0;border-radius:14px;background:#2563eb;color:white;font:700 17px system-ui;padding:15px;touch-action:none;cursor:pointer}button:disabled{opacity:.45}.tabs{display:flex;gap:8px}.tabs button{flex:1;background:#29384e}.tabs button[aria-pressed=true]{background:#2563eb}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(100%,390px);margin:25px auto}.pad button{aspect-ratio:1;font-size:clamp(25px,10vw,50px);padding:0;user-select:none}.pad button.active{background:#60a5fa}.center{display:grid;place-items:center;font-size:32px}.joy{position:relative;width:min(100%,65dvh,600px);aspect-ratio:1;margin:15px auto;border:4px solid #40536d;border-radius:50%;background:radial-gradient(circle,#243449 0 12%,#1b293c 13% 48%,#172235 49%);touch-action:none;user-select:none}.joy:before,.joy:after{content:'';position:absolute;background:#42546b}.joy:before{width:2px;top:6%;bottom:6%;left:50%}.joy:after{height:2px;left:6%;right:6%;top:50%}.stick{position:absolute;width:28%;height:28%;left:36%;top:36%;border-radius:50%;background:linear-gradient(145deg,#60a5fa,#1d4ed8);border:4px solid #93c5fd;pointer-events:none}p,small{text-align:center;color:#cbd5e1}#error{color:#fca5a5} [hidden]{display:none!important}
</style></head><body><main><header><h1>🕹️ Mini Tank – Pfeiltasten</h1><div id="status" role="status">Nicht verbunden</div></header><button id="connect">Bluetooth verbinden</button><section id="buttons"><div class="pad"><span></span><button data-dir="up" aria-label="Vorwärts">↑</button><span></span><button data-dir="left" aria-label="Links">←</button><span class="center">⚙️</span><button data-dir="right" aria-label="Rechts">→</button><span></span><button data-dir="down" aria-label="Rückwärts">↓</button><span></span></div><p>Programmiere die vier Fahrtrichtungen in MakeCode.</p></section><div id="error" role="alert"></div><small>iPhone: Bluefy · Android: Chrome · Calliope mini V2</small></main><script>
'use strict';
const $=id=>document.getElementById(id), encoder=new TextEncoder();
const SERVICE='6e400001-b5a3-f393-e0a9-e50e24dcca9e', RX='6e400003-b5a3-f393-e0a9-e50e24dcca9e';
let device=null,ch=null,busy=false,pending=null,generation=0,pointer=null,dir=null,x=0,y=0,connecting=false;
const connected=()=>!!(device?.gatt?.connected&&ch);
function status(){ $('status').textContent=connected()?'Verbunden mit '+(device.name||'Calliope'):'Nicht verbunden'; $('connect').textContent=connected()?'Trennen':'Bluetooth verbinden'; }
async function send(s){if(!connected())return;pending=s;if(busy)return;busy=true;const g=generation;try{while(pending!==null&&g===generation&&connected()){const data=encoder.encode(pending);pending=null;const c=ch;if(c.properties.writeWithoutResponse&&c.writeValueWithoutResponse)await c.writeValueWithoutResponse(data);else if(c.properties.write&&c.writeValueWithResponse)await c.writeValueWithResponse(data);else await c.writeValue(data);}}catch(e){$('error').textContent='Senden fehlgeschlagen: '+e.message;pending=null;clearInput();if(device?.gatt?.connected)device.gatt.disconnect();}finally{busy=false;if(pending!==null&&connected())send(pending);}}
function display(){document.querySelectorAll('[data-dir]').forEach(b=>b.classList.toggle('active',b.dataset.dir===dir));}
function command(){return dir?dir+'\n':'X+00,Y+00\n';}
function clearInput(){pointer=null;dir=null;x=y=0;display();}
function stop(){clearInput();send('X+00,Y+00\n');}
function release(e){if(e.pointerId===pointer)stop();}
function bind(el,start){el.addEventListener('pointerdown',e=>{if(!connected()||pointer!==null)return;e.preventDefault();pointer=e.pointerId;el.setPointerCapture(pointer);start(e);});for(const event of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(event,release);}
document.querySelectorAll('[data-dir]').forEach(b=>bind(b,()=>{dir=b.dataset.dir;display();send(command());}));
window.addEventListener('blur',stop);document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});
function disconnected(){generation++;pending=null;ch=null;clearInput();status();}
$('connect').onclick=async()=>{if(connecting)return;$('error').textContent='';if(connected()){stop();device.gatt.disconnect();disconnected();return;}if(!navigator.bluetooth){$('error').textContent='Web Bluetooth fehlt. iPhone: Bluefy, Android: Chrome.';return;}connecting=true;$('connect').disabled=true;try{device=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[SERVICE]});device.addEventListener('gattserverdisconnected',disconnected);const server=await device.gatt.connect();const service=await server.getPrimaryService(SERVICE);ch=await service.getCharacteristic(RX);generation++;clearInput();status();send(command());}catch(e){$('error').textContent='Verbindung fehlgeschlagen: '+e.message;if(device?.gatt?.connected)device.gatt.disconnect();disconnected();}finally{connecting=false;$('connect').disabled=false;}};
setInterval(()=>{if(pointer!==null&&connected())send(command());},50);status();display();
</script></body></html>
